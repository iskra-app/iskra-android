# Проверка каждого push и каждого PR.
#
# `pull_request`, а не `pull_request_target`: PR из форка не получает секретов. Сейчас репозиторий
# закрыт и это кажется лишним; после открытия станет обязательным, а переделывать workflow в момент
# открытия — лишний риск (docs/PROMPT.md, 19.2). Подписанные сборки — только из тегов на main
# (release.yml, этап MVP).
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;36.1.0 ndk;29.0.14206865"
      - uses: gradle/actions/setup-gradle@v6
      # Крейт клиента моста (:tunnel, docs/PROMPT.md, 9.3): Rust с целями Android и cargo-ndk;
      # NDK — та же версия, что `ndk` в libs.versions.toml.
      - name: Rust для :tunnel
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tunnel
      # check: юнит-тесты, lint (MissingTranslation и MissingQuantity — ошибки), правило модулей,
      # foss без Google (checkModuleRules) и cargo test крейта моста вместе с вендоренным proto. Релизная сборка — потому что keep-правила R8 для
      # uniffi/JNA ломаются только в ней.
      - run: ./gradlew check assembleFossRelease --no-daemon
      - name: Размер APK
        run: |
          for apk in app/build/outputs/apk/*/release/*.apk; do
            printf '%s\t%s\n' "$(stat -c %s "$apk" | numfmt --to=iec)" "$(basename "$apk")"
          done | tee -a "$GITHUB_STEP_SUMMARY"
      # 16 KB page size: телефоны на Android 15+ с 16 KB страницами не загрузят .so, выровненные
      # на 4 KB (docs/PROMPT.md, 19).
      - name: Выравнивание .so на 16 KB
        run: |
          zipalign=$(ls "$ANDROID_HOME"/build-tools/*/zipalign | tail -1)
          for apk in app/build/outputs/apk/*/release/*.apk; do "$zipalign" -c -P 16 -v 4 "$apk" > /dev/null; done
      # zipalign смотрит, где .so лежат в архиве; телефон смотрит ещё и в саму библиотеку — LOAD-сегменты
      # SDK, :tunnel и MapLibre тоже должны быть на 16 KB.
      - name: LOAD-сегменты .so на 16 KB
        run: scripts/check_elf_alignment.sh app/build/outputs/apk/*/release/*.apk

  # Сгенерированное не правится руками: синхронизация с iOS на том же коммите не меняет дерево.
  # iOS-репозиторий закрыт, поэтому шаг идёт только там, где есть токен на чтение (не в PR).
  sync:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    env:
      ISKRA_READ_TOKEN: ${{ secrets.ISKRA_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Синхронизация идемпотентна
        if: env.ISKRA_READ_TOKEN != ''
        run: |
          set -eu
          ios_rev=$(head -1 features/src/main/res/UPSTREAM | cut -d' ' -f2)
          bridge_rev=$(head -1 third_party/iskra-tunnel-proto/UPSTREAM | cut -d' ' -f2)
          git clone -q "https://x-access-token:${ISKRA_READ_TOKEN}@github.com/iskra-app/iskra.git" ../iskra
          git clone -q "https://x-access-token:${ISKRA_READ_TOKEN}@github.com/iskra-app/iskra-bridge.git" ../iskra-bridge
          scripts/sync-from-ios.sh ../iskra "$ios_rev" --bridge ../iskra-bridge --bridge-rev "$bridge_rev"
          git diff --exit-code
          test -z "$(git status --porcelain)"

  # Ни одного секрета в истории: репозиторий откроется целиком (docs/PROMPT.md, 19.2).
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --exit-code 1 .
