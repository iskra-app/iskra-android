# Релиз по тегу `v*` на main (docs/PROMPT.md, 19; как выпустить — docs/RELEASING.md).
#
# Собирает оба flavor'а, подписывает ключом из секретов, прогоняет check, кладёт в GitHub Release APK,
# SHA256SUMS и release.json — его читает встроенная проверка обновлений в каждой установленной версии.
# Отказывает, а не публикует наполовину: тег не на main, репозиторий закрыт (релиз в закрытом никто не
# скачает, и проверка обновлений получит 404), версия тега не та, «Что нового» не на семи языках, нет
# проекта Firebase для gms, отпечаток ключа не тот.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Только здесь: создать релиз и приложить файлы.
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Тег — на main
        run: |
          git fetch -q origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Репозиторий открыт
        run: |
          visibility=$(gh repo view "$GITHUB_REPOSITORY" --json visibility -q .visibility)
          if [ "$visibility" != "PUBLIC" ]; then
            echo "::error::Репозиторий $visibility: релиз в закрытом никто не скачает (docs/PROMPT.md, 19.2)"
            exit 1
          fi

      - name: Версия тега — versionName
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "versionName = \"$version\"" app/build.gradle.kts || {
            echo "::error::Тег $GITHUB_REF_NAME, а versionName в app/build.gradle.kts другой"
            exit 1
          }
          echo "name=$version" >> "$GITHUB_OUTPUT"

      - name: «Что нового» на семи языках
        run: python3 scripts/release_json.py --check-notes "release-notes/${{ steps.version.outputs.name }}.json"

      - name: Проект Firebase для gms
        run: |
          test -f app/src/gms/google-services.json || {
            echo "::error::gms без app/src/gms/google-services.json собирается без пушей — такой релиз не выпускается"
            exit 1
          }

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0 ndk;29.0.14206865"
      - uses: gradle/actions/setup-gradle@v6
      # Крейт клиента моста (:tunnel, docs/PROMPT.md, 9.3): Rust с целями Android и cargo-ndk;
      # NDK — та же версия, что `ndk` в libs.versions.toml.
      - name: Rust для :tunnel
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tunnel

      - name: Ключ подписи
        env:
          ISKRA_KEYSTORE_BASE64: ${{ secrets.ISKRA_KEYSTORE_BASE64 }}
          ISKRA_CERT_SHA256: ${{ vars.ISKRA_CERT_SHA256 }}
        run: |
          test -n "$ISKRA_KEYSTORE_BASE64" || { echo "::error::Нет секрета ISKRA_KEYSTORE_BASE64"; exit 1; }
          # Отпечаток — не секрет, но и не необязателен: им сверяется, что подписано *тем* ключом.
          test -n "$ISKRA_CERT_SHA256" || { echo "::error::Нет переменной ISKRA_CERT_SHA256"; exit 1; }
          echo "$ISKRA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ISKRA_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Проверка и сборка
        env:
          ISKRA_KEYSTORE_PASSWORD: ${{ secrets.ISKRA_KEYSTORE_PASSWORD }}
          ISKRA_KEY_ALIAS: ${{ secrets.ISKRA_KEY_ALIAS }}
          ISKRA_KEY_PASSWORD: ${{ secrets.ISKRA_KEY_PASSWORD }}
        run: ./gradlew check assembleGmsRelease assembleFossRelease --no-daemon

      - name: Файлы релиза
        run: |
          set -eu
          tools="$ANDROID_HOME/build-tools/37.0.0"
          version="${{ steps.version.outputs.name }}"
          mkdir dist
          for apk in app/build/outputs/apk/*/release/app-*-release.apk; do
            name=$(basename "$apk" .apk); name=${name#app-}; name=${name%-release}
            # 16 KB page size: .so, выровненные на 4 KB, не загрузятся на Android 15+ с 16 KB страницами.
            "$tools/zipalign" -c -P 16 4 "$apk"
            cp "$apk" "dist/iskra-$version-$name.apk"
          done
          python3 scripts/release_json.py --dist dist \
            --notes "release-notes/$version.json" \
            --apksigner "$tools/apksigner" --aapt2 "$tools/aapt2" \
            --expect-cert "${{ vars.ISKRA_CERT_SHA256 }}"
          (cd dist && sha256sum *.apk release.json > SHA256SUMS)
          for apk in dist/*.apk; do
            printf '%s\t%s\n' "$(stat -c %s "$apk" | numfmt --to=iec)" "$(basename "$apk")"
          done | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Релиз
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk dist/release.json dist/SHA256SUMS \
            --title "Искра ${{ steps.version.outputs.name }}" \
            --notes-file dist/notes.md \
            --verify-tag

      - name: Убрать ключ
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
