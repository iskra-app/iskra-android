# Временное: снимки экранов демо с новым шрифтом. Ветка screenshots удаляется после.
name: Screenshots

on:
  push:
    branches: [screenshots]

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;36.1.0"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew assembleFossDebug --no-daemon
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: python3 .github/shots/shoot.py "$(ls app/build/outputs/apk/foss/debug/*.apk | head -1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shots
      - name: Снимки в ветку
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -B screenshots-out
          mkdir -p shots && touch shots/.keep
          git add -f shots
          git commit -qm "Снимки" && git push -f origin screenshots-out
