[versions]
# Сборка
agp = "9.4.1"
kotlin = "2.4.21"

# Android: какие устройства и против какого SDK.
#
# minSdk 29 (Android 10) — решение автора (docs/PROMPT.md, 2.2). Его задают scoped storage без
# WRITE_EXTERNAL_STORAGE, Keystore без старых багов, TLS 1.3 в системе и единая модель жестов.
# Conversation-уведомления (API 30) и размытие хрома (API 31) — через проверку версии в одном
# месте на функцию. Ниже 29 — четыре-пять процентов устройств ценой отдельных путей для хранилища
# и медиа; не стоит. Это то же, что `Mutex` задаёт iOS 18 в Package.swift.
minSdk = "29"
# Последний стабильный.
compileSdk = "37"
targetSdk = "37"

# Matrix. Тот же коммит matrix-rust-sdk (15a3ce2), что Swift-пакет 26.08.11 в
# iskra/Core/Package.swift: у Kotlin-биндингов свои номера релизов, и 26.08.11 — тот, что собран
# с этого коммита. Обновлять на обеих платформах вместе.
matrixSdk = "26.08.11"

# NDK для крейта клиента моста (:tunnel, docs/PROMPT.md, 9.3). r28+ выравнивает .so на 16 KB сам.
ndk = "29.0.14206865"
# JNA — та же, что тянет sdk-android: биндинги :tunnel и SDK ходят в нативный код одним JNA.
jna = "5.18.1"
# WebSocket'ы к relay'ям моста и свои запросы приложения через его прокси (docs/PROMPT.md, 9.3, 9.6). Та же
# версия, что у MapLibre: две OkHttp в одном APK не нужны. Apache 2.0.
okhttp = "4.12.0"

coroutines = "1.11.0"
serialization = "1.11.0"
collectionsImmutable = "0.5.2"

androidxCore = "1.19.1"
glance = "1.1.1"
activity = "1.13.0"
lifecycle = "2.11.0"
datastore = "1.2.1"
browser = "1.10.0"
# Поворот оригинала перед отправкой фото (MediaPreparation). Apache 2.0.
exifinterface = "1.4.2"
composeBom = "2026.09.00"
# Видео и кружочки (docs/PROMPT.md, раздел 10): ExoPlayer и его поверхность для Compose. Apache 2.0.
media3 = "1.11.1"
# Запись кружочков (docs/PROMPT.md, 11.4): CameraX поверх Camera2, без сервисов Google. Apache 2.0.
camerax = "1.6.1"
# Блокировка приложения (docs/PROMPT.md, раздел 12): BiometricPrompt с откатом на пин устройства. Apache 2.0.
biometric = "1.1.0"
# biometric тянет fragment 1.2.5, а он отвергает коды запросов activity 1.13 («lower 16 bits») — любое окно разрешений вешало приложение
fragment = "1.8.9"
# Карта: MapLibre Native с векторными тайлами OpenFreeMap (docs/PROMPT.md, 11.6) — без Google Maps и без ключа API.
maplibre = "11.8.0"
# Чтение QR (docs/PROMPT.md, 5): только декодер ZXing, без ML Kit и сервисов Google. Apache 2.0.
zxing = "3.5.3"
# Тональные палитры Material 3 из цвета акцента (HCT, схемы TonalSpot/Monochrome). Порт на Kotlin
# material-color-utilities Google, без Compose и без библиотек Google; MIT.
materialColorUtilities = "5.0.1"

# Пуши `gms` (docs/PROMPT.md, 10.2): только FCM, только во flavor'е gms — `foss` без них (checkModuleRules).
# Плагин google-services применяется, только когда есть app/src/gms/google-services.json.
firebaseMessaging = "25.1.3"
googleServices = "4.4.4"

# Лицензии зависимостей (docs/PROMPT.md, 19.2): licensee в check падает на неразрешённой, aboutlibraries
# собирает список для «О приложении». Оба Apache-2.0, без Google.
licensee = "1.14.1"
aboutLibraries = "15.3.0"

androidxTestExt = "1.3.0"
androidxTestRunner = "1.7.0"
turbine = "1.2.1"

[libraries]
aboutlibraries-core = { module = "com.mikepenz:aboutlibraries-core", version.ref = "aboutLibraries" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging", version.ref = "firebaseMessaging" }
matrix-sdk = { module = "org.matrix.rustcomponents:sdk-android", version.ref = "matrixSdk" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
okhttp-tls = { module = "com.squareup.okhttp3:okhttp-tls", version.ref = "okhttp" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "collectionsImmutable" }

androidx-core = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "browser" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui-compose = { module = "androidx.media3:media3-ui-compose", version.ref = "media3" }
media3-transformer = { module = "androidx.media3:media3-transformer", version.ref = "media3" }
media3-effect = { module = "androidx.media3:media3-effect", version.ref = "media3" }

androidx-glance = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }
maplibre = { module = "org.maplibre.gl:android-sdk", version.ref = "maplibre" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
androidx-camera-video = { module = "androidx.camera:camera-video", version.ref = "camerax" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }

material-color-utilities = { module = "com.materialkolor:material-color-utilities", version.ref = "materialColorUtilities" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons = { module = "androidx.compose.material:material-icons-extended" }

kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExt" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
licensee = { id = "app.cash.licensee", version.ref = "licensee" }
aboutlibraries = { id = "com.mikepenz.aboutlibraries.plugin", version.ref = "aboutLibraries" }
