# Сгенерировано scripts/sync-from-ios.sh из Cargo.toml крейта и корня iskra-bridge.

[package]
name = "iskra-tunnel-proto"
description = "Wire format shared by the Iskra nostr tunnel bridge and client"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
nostr-sdk = { version = "0.44", features = ["nip44"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
base64 = { version = "0.22" }
uuid = { version = "1", features = ["v4"] }
thiserror = { version = "2" }
